<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>FIT Study Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a student's "index" — summary band with the 180-credit bar, then one ledger section per semester */
:root{
  --paper:#f4f6f8; --card:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#d8dee6;
  --accent:#d0102b; --accent-soft:#fbe5e8; --blue:#1f4f8f; --blue-soft:#e3ecf7;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b4232c; --bad-soft:#fbe3e4; --bar:#ffffff; --bar-fg:#14202e;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f151d; --card:#17202b; --ink:#e6ebf1; --muted:#97a3b2; --line:#2a3644;
  --accent:#ff4d64; --accent-soft:#3a1820; --blue:#7fb0ef; --blue-soft:#1b2a3d;
  --ok:#5fd394; --ok-soft:#163023; --warn:#f0b956; --warn-soft:#33270f; --bad:#ff7a82; --bad-soft:#3a1a1d; --bar:#000000; --bar-fg:#e6ebf1; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151d; --card:#17202b; --ink:#e6ebf1; --muted:#97a3b2; --line:#2a3644;
  --accent:#ff4d64; --accent-soft:#3a1820; --blue:#7fb0ef; --blue-soft:#1b2a3d;
  --ok:#5fd394; --ok-soft:#163023; --warn:#f0b956; --warn-soft:#33270f; --bad:#ff7a82; --bad-soft:#3a1a1d; --bar:#000000; --bar-fg:#e6ebf1; color-scheme:dark}
/* the page's own Light / Dark switch wins over the system and viewer theme */
:root[data-mode="light"]{
  --paper:#f4f6f8; --card:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#d8dee6;
  --accent:#d0102b; --accent-soft:#fbe5e8; --blue:#1f4f8f; --blue-soft:#e3ecf7;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b4232c; --bad-soft:#fbe3e4; --bar:#ffffff; --bar-fg:#14202e; color-scheme:light}
:root[data-mode="dark"]{
  --paper:#0f151d; --card:#17202b; --ink:#e6ebf1; --muted:#97a3b2; --line:#2a3644;
  --accent:#ff4d64; --accent-soft:#3a1820; --blue:#7fb0ef; --blue-soft:#1b2a3d;
  --ok:#5fd394; --ok-soft:#163023; --warn:#f0b956; --warn-soft:#33270f; --bad:#ff7a82; --bad-soft:#3a1a1d; --bar:#000000; --bar-fg:#e6ebf1; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sumhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sumhead .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{margin:0;font-size:13px;color:var(--muted);max-width:70ch}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.stamp{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;line-height:1.05;text-align:center;transform:rotate(-8deg)}
.brand h1{font-size:28px}
.logorow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.logo{height:52px;width:auto;max-width:100%;object-fit:contain;object-position:left;align-self:start}
.madeby{margin:8px 0 0;font-size:13px;color:var(--muted);text-align:center}
.gate{gap:16px}
.foot .madeby{text-align:left}
.unoff{margin:0;font-size:12px;color:var(--warn)}
/* entry notice: shown until the viewer types the accept word */
.gate{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.gate-card h2{font-size:24px}
.gate-card p{margin:0;color:var(--ink);max-width:65ch}
.gate-card .warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px}
.gate-card label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.gate-card input{font-size:16px;padding:8px 10px}
.gate-card .btn{justify-self:start;padding:8px 16px;font-size:14px}
.gate-card .btn:disabled{opacity:.4;cursor:not-allowed}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.saved .dot{background:var(--ok)} .chip.pending .dot{background:var(--warn)} .chip.err .dot{background:var(--bad)}

/* summary */
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:18px}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.big .pct{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;color:var(--ink)}
.big .of{color:var(--muted)}
.bar{position:relative;height:22px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar .done{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar .prog{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,var(--accent-soft) 0 6px,transparent 6px 12px);border-right:1px dashed var(--accent)}
.bar .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.scale{position:relative;height:16px;font-size:11px;color:var(--muted)}
.scale span{position:absolute;transform:translateX(-50%)}
.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.reqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.req{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.req .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.req .v{font-family:var(--f-mono);font-size:18px;font-weight:500}
.req .s{font-size:12px;color:var(--muted)}
.req.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-soft)}
.req.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-soft)}
.req.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--bad-soft)}

/* semester picker bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.picker{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.picker .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.picker .grp{display:flex;align-items:center;gap:8px}
.picker .seg{background:transparent;border-color:color-mix(in srgb,var(--bar-fg) 30%,transparent)}
.picker .seg button{color:var(--bar-fg);opacity:.75;padding:6px 14px}
.picker .seg button[aria-pressed="true"]{background:var(--bar-fg);color:var(--bar);opacity:1}
.picker .pmeta{margin-left:auto;font-size:13px;opacity:.85}

/* semester sections */
.sem{display:grid;gap:12px}
.sem-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sem-head h2{font-size:22px}
.sem-head .meta{color:var(--muted);font-size:13px}
.tag-now{font-family:var(--f-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:8px;vertical-align:3px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
details.course{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
details.course[data-st="passed"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
details.course[data-st="failed"]{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.course summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.course summary::-webkit-details-marker{display:none}
.code{font-family:var(--f-mono);font-weight:500;font-size:14px;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:2px 7px}
.cname{font-weight:600;font-size:14px;line-height:1.3;min-width:0}
.cmeta{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pill.enrolled{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.pill.credit{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.passed{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.failed{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cbody{padding:0 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.wrap>*,main>*,.sem>*{min-width:0}
select{max-width:100%}
.strip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select,input[type=text]{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;min-width:0}
table.pts{width:100%;border-collapse:collapse;font-size:13px}
table.pts td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:middle}
table.pts td:first-child{width:100%;padding-right:8px}
table.pts td.n{white-space:nowrap;text-align:right;color:var(--muted)}
table.pts input{width:56px;text-align:right;font-family:var(--f-mono);padding:3px 6px}
table.pts tr.sum td{border-bottom:0;font-weight:600;padding-top:6px}
.minnote{font-size:11px;color:var(--warn)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:14px}
.linkbtn{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;font-size:12px;font-weight:500;text-align:left}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow input{flex:1 1 120px}
.addrow input.sm{flex:0 0 64px}
.verdict{border-radius:8px;padding:8px 10px;font-size:13px}
.verdict span{display:block}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.info{background:var(--blue-soft);color:var(--blue)}
.verdict b{font-weight:600}
.attempts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.attempts label{font-size:11px;color:var(--muted);display:grid;gap:2px}
.attempts input{width:100%;text-align:right;font-family:var(--f-mono)}
.grade{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.totline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.src{font-size:11px;color:var(--muted)}
.src a{color:var(--blue)}
.addel{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:transparent}
.strikes{display:inline-flex;gap:4px}
.sb{width:22px;height:22px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;line-height:1}
.sb.x{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.sb.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.failrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.failrow .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big3 .sb{width:30px;height:30px;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);justify-self:start}
.btn.apply{background:var(--ok);border-color:var(--ok);color:var(--card);padding:8px 12px;justify-self:start}
.addel>summary,.addt>summary{cursor:pointer;list-style:none}
.addel>summary::-webkit-details-marker,.addt>summary::-webkit-details-marker{display:none}
.addel h3{font-family:var(--f-body);font-size:13px;font-weight:600}
.addel .addrow select{flex:0 0 auto}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:7px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer}
.foot{font-size:12px;color:var(--muted);display:grid;gap:6px;max-width:72ch}
.foot h3{font-family:var(--f-body);font-size:13px;color:var(--ink)}
.grades{display:flex;flex-wrap:wrap;gap:6px}
.grades span{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
@media (prefers-reduced-motion:no-preference){.bar .done,.bar .prog,.strip .mini b{transition:width .4s ease}}
</style>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form" novalidate>
    <div class="row" style="justify-content:space-between"><h2 id="g-title">Before you continue</h2>
      <div class="seg" role="group" aria-label="Language"><button id="g-en" type="button" aria-pressed="true">EN</button><button id="g-sk" type="button" aria-pressed="false">SK</button></div></div>
    <p class="warn" id="g-warn"></p>
    <p id="g-body"></p>
    <label><span id="g-lbl"></span><input type="text" id="g-input" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <button class="btn" type="submit" id="g-btn" disabled>Continue</button>
  </form>
  <p class="madeby">Made by Filipko ❤️</p>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <div style="display:grid;gap:10px;min-width:0">
        <div class="logorow">
          <img id="logo" class="logo" src="logo-en.webp" alt="Brno University of Technology, Faculty of Information Technology">
          <h1 id="t-title">FIT Study Index</h1>
        </div>
        <p id="t-sub">Bachelor · Information Technology (BIT) · Faculty of Information Technology, BUT Brno</p>
        <p class="unoff" id="t-unoff">Unofficial student tool, not run by VUT or FIT.</p>
      </div>
    </div>
    <div class="tools">
      <span class="chip" id="savechip"><span class="dot"></span><span id="savetxt">Saved on this device</span></span>
      <div class="seg" role="group" aria-label="Theme">
        <button id="th-light" type="button" aria-pressed="false">Light</button>
        <button id="th-dark" type="button" aria-pressed="false">Dark</button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" type="button" aria-pressed="true">EN</button>
        <button id="lang-sk" type="button" aria-pressed="false">SK</button>
      </div>
    </div>
  </header>
  <section class="summary" id="summary"></section>
  <nav class="picker" id="picker" aria-label="Semester"></nav>
  <main id="sems" style="display:grid;gap:32px"></main>
  <footer class="foot" id="foot"></footer>
</div>

/* ---------- State ---------- */
const LS="fit-index-state-v1";
let S=null, artifact=null, canPublish=true, dirty=false, timer=null;
const cur=()=>S.current||"1W";
function defaults(){
  return {v:1,lang:"en",current:"1W",pva:"",pvt:"",courses:{},electives:[]};
}
function cs(code){ // per-course record
  if(!S.courses[code]){
    const def=allCourses().find(x=>x.c===code);
    S.courses[code]={status:def&&def.s===cur()?"enrolled":"planned",pts:{},extra:[],maxOv:{},exam:["","",""],enroll:1,taken:def?def.s:"1W",credit:null};
  }
  return S.courses[code];
}
function allCourses(){
  const list=[...COURSES];
  const a=PVA.find(x=>x.c===S.pva); if(a) list.push({...a,k:"A",parts:a.t==="Ex"?[]:[],exam:a.t==="Ex"||a.t==="Cr+Ex"?EX(100):null,free:true});
  const b=PVT.find(x=>x.c===S.pvt); if(b) list.push({...b,k:"T",parts:[],free:true});
  for(const e of S.electives) list.push({c:e.c,en:e.n,sk:e.n,cr:e.cr,t:e.t,k:"E",s:e.s,parts:[],exam:e.t==="Cr+Ex"||e.t==="Ex"?EX(100):null,custom:true,free:true});
  return list;
}
function load(json){
  S=Object.assign(defaults(),json||{});
}
function localSave(){try{localStorage.setItem(LS,JSON.stringify({at:Date.now(),s:S}))}catch(e){}}
function localLoad(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");return r}catch(e){return null}}

/* ---------- Saving: publish data/state.json through the artifact capability, plus a device copy ---------- */
function setChip(kind,txt){const c=document.getElementById("savechip");c.className="chip "+kind;document.getElementById("savetxt").textContent=txt}
function changed(){
  localSave();
  if(!artifact||!canPublish){setChip("saved",L()[canPublish?"local":"readonly"]);return}
  dirty=true;setChip("pending",L().unsaved);
  clearTimeout(timer);timer=setTimeout(publishNow,3000);
}
async function publishNow(){
  if(!dirty||!artifact)return;dirty=false;setChip("pending",L().saving);
  try{await artifact.publish({"data/state.json":JSON.stringify(S)});setChip("saved",L().saved)}
  catch(e){
    const code=e&&e.code;
    if(["not_writer","not_granted","capability_disabled","consent_required","not_declared","capability_removed"].includes(code)){canPublish=false;setChip("saved",L().readonly)}
    else if(code==="conflict"){setChip("pending",L().saving)}
    else setChip("err",L().saveErr);
  }
}

/* ---------- Calculations ---------- */
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmt=n=>Math.round(n*10)/10;
const L=()=>T[S.lang];
const nm=o=>o[S.lang]||o.en;
function grade(p){return p>=90?"A":p>=80?"B":p>=70?"C":p>=60?"D":p>=50?"E":"F"}
function partsOf(d){
  const r=cs(d.c);
  const base=(d.parts||[]).map((p,i)=>({key:"p"+i,n:nm(p),max:r.maxOv["p"+i]!=null?r.maxOv["p"+i]:p.max,min:p.min,val:r.pts["p"+i]}));
  const extra=r.extra.map(x=>({key:x.id,n:x.n,max:x.max,val:x.val,custom:true}));
  return [...base,...extra];
}
function calc(d){
  const r=cs(d.c), parts=partsOf(d);
  const semPts=parts.reduce((a,p)=>a+(num(p.val)||0),0);
  const anyPts=parts.some(p=>num(p.val)!=null);
  const threshold=d.credit!=null?d.credit:(r.credit!=null?r.credit:null);
  const partFails=parts.filter(p=>p.min&& (num(p.val)||0)<p.min);
  const hasCreditStep=d.t==="Cr+Ex"||d.t==="Cr";
  let creditOk=hasCreditStep && (threshold==null?partFails.length===0&&!d.creditUnknown:semPts>=threshold&&partFails.length===0);
  // zeroMax: course credit needs every test written and at most N of them with 0 points
  let zeros=0,missing=0;
  if(d.zeroMax!=null){const base=parts.filter(p=>!p.custom);zeros=base.filter(p=>num(p.val)===0).length;missing=base.filter(p=>num(p.val)==null).length;creditOk=zeros<=d.zeroMax&&missing===0}
  const tries=r.exam.map(num);
  const used=tries.filter(x=>x!=null).length;
  const lastExam=[...tries].reverse().find(x=>x!=null);
  const exMin=d.exam&&d.exam.min||0;
  const examOk=lastExam!=null&&lastExam>=exMin;
  const total=semPts+(d.exam&&examOk?lastExam:0);
  // did the course pass on points? (decides when the "add credits" button appears)
  let passedPts=false;
  if(d.exam) passedPts=examOk&&total>=50&&(d.t!=="Cr+Ex"||creditOk||(threshold==null&&!d.zeroMax&&!d.creditUnknown&&!partFails.length));
  else if(d.t==="ClCr") passedPts=anyPts&&semPts>=50;
  else if(d.t==="Cr"&&parts.length) passedPts=creditOk&&threshold!=null;
  // one box per exam term: X = failed attempt, ✓ = passed
  const marks=tries.map(x=>x==null?"":(x>=exMin&&semPts+x>=50?"ok":"x"));
  const fails=marks.filter(m=>m==="x").length;
  return {r,parts,semPts,anyPts,threshold,partFails,creditOk,tries,used,lastExam,exMin,examOk,total,zeros,missing,passedPts,marks,fails};
}
function stats(){
  const list=allCourses();let passed=0,prog=0,comp=0,elec=0;
  const byYear={},bySlot={};
  for(const d of list){
    const r=cs(d.c);
    if(r.status==="passed"){passed+=d.cr;if(d.k==="C")comp+=d.cr;if(d.k==="E")elec+=d.cr;
      byYear[r.taken[0]]=(byYear[r.taken[0]]||0)+d.cr;bySlot[r.taken]=(bySlot[r.taken]||0)+d.cr}
    else if(r.status==="enrolled"||r.status==="credit")prog+=d.cr;
  }
  return {passed,prog,comp,elec,byYear,bySlot,list};
}

    const need=Math.max(k.exMin,50-k.semPts);

function applyTheme(){

  const dark=m?m==="dark":matchMedia("(prefers-color-scheme: dark)").matches;

// IDM / ILG: a second test with 0 points means no course credit, so the course is failed automatically
function autoFail(code){
  const d=COURSES.find(x=>x.c===code);if(!d||d.zeroMax==null)return;
  const r=cs(code),k=calc(d);
  if(k.zeros>d.zeroMax&&r.status!=="failed"){r.status="failed";r.autoFail=1}
  else if(k.zeros<=d.zeroMax&&r.autoFail){r.status="enrolled";delete r.autoFail}
}

document.addEventListener("input",e=>{
  const el=e.target,f=el.dataset.f,c=el.dataset.c;if(!f)return;
  const r=c?cs(c):null;
  if(f==="pt")r.pts[el.dataset.k]=el.value;

  else if(f==="exam")r.exam[+el.dataset.k]=el.value;

  if(f==="pt"){const x=r.extra.find(x=>x.id===el.dataset.k);if(x)x.val=el.value}

  else if(f==="taken")cs(c).taken=el.value;
  else if(f==="enroll")cs(c).enroll=+el.value;
  else if(f==="pva"||f==="pvt"){S[f]=el.value;if(el.value){const r=cs(el.value);r.taken=cur();if(r.status==="planned")r.status="enrolled"}}
  else return;
  rerender();changed();
});
document.addEventListener("toggle",e=>{
  const d=e.target;if(!d.classList||!d.classList.contains("course"))return;
  S.open=S.open||{};const k=d.id.slice(2);if(d.open)S.open[k]=1;else delete S.open[k];localSave();
},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="g-en"||b.id==="g-sk"){S.lang=b.id.slice(2);render();renderGate();localSave();return}
  if(b.id==="lang-en"||b.id==="lang-sk"){S.lang=b.id.slice(5);rerender();changed();return}
  if(b.id==="th-light"||b.id==="th-dark"){try{localStorage.setItem("fit-theme",b.id.slice(3))}catch(e){}applyTheme();return}
  if(b.dataset.view){S.view=b.dataset.view;render();changed();return}
  if(b.dataset.year||b.dataset.half){const c=cur();S.current=(b.dataset.year||c[0])+(b.dataset.half||c[1]);render();changed();return}
  if(b.dataset.apply){cs(b.dataset.apply).status="passed";rerender();changed();return}
  if(b.dataset.retake){const r=cs(b.dataset.retake);r.taken=SLOTS[SLOTS.indexOf(r.taken)+2];r.enroll=2;r.status="planned";r.exam=["","",""];r.pts={};r.extra=[];rerender();changed();return}
  if(b.dataset.add){const c=b.dataset.add,n=document.getElementById("an-"+c).value.trim(),m=num(document.getElementById("am-"+c).value);if(!n)return document.getElementById("an-"+c).focus();
    cs(c).extra.push({id:"x"+Date.now().toString(36),n,max:m==null?"":m,val:""});rerender();changed();return}
  if(b.dataset.del){const r=cs(b.dataset.del);r.extra=r.extra.filter(x=>x.id!==b.dataset.k);rerender();changed();return}
  if(b.dataset.addel){const s=b.dataset.addel,g=id=>document.getElementById(id);
    const c=g("el-c-"+s).value.trim().toUpperCase(),n=g("el-n-"+s).value.trim(),cr=parseInt(g("el-cr-"+s).value,10),t=g("el-t-"+s).value;
    if(!c||allCourses().some(x=>x.c===c))return g("el-c-"+s).focus(); if(!(cr>0))return g("el-cr-"+s).focus();
    S.electives.push({c,n:n||c,cr,t,s});const r=cs(c);r.taken=s;r.status=s===cur()?"enrolled":"planned";S.open=S.open||{};S.open[c]=1;rerender();changed();return}
  if(b.dataset.rmel){const c=b.dataset.rmel;S.electives=S.electives.filter(x=>x.c!==c);delete S.courses[c];rerender();changed();return}
});

/* ---------- Boot ---------- */
(async function boot(){
  let server=null;
  try{const r=await fetch("data/state.json",{cache:"no-store"});if(r.ok)server=await r.json()}catch(e){}
  const local=localLoad();
  const serverHasData=server&&server.courses&&Object.keys(server.courses).length;
  load(serverHasData?server:(local&&local.s)||server||null);
  if(!S.courses.ISM)cs("ISM");
  // IDM changed from one 20-point row to 5 tests: drop the old total, move self-added "Test N" rows into the new slots
  if(!S.idm5&&S.courses.IDM){const r=S.courses.IDM;
    if(num(r.pts.p0)>4)delete r.pts.p0;
    r.extra=r.extra.filter(x=>{const m=/^(test|písomka)\s*([1-5])$/i.exec(x.n.trim());if(!m)return true;r.pts["p"+(m[2]-1)]=x.val;delete r.pts[x.id];return false});
  }
  S.idm5=1;
  showGate();
  COURSES.filter(d=>d.zeroMax!=null).forEach(d=>autoFail(d.c));
  render();
  setChip("saved",L().local);
  try{
    if(window.claude&&window.claude.use){
      artifact=await window.claude.use("artifact");
      if(artifact){setChip("saved",L().saved)}
    }
  }catch(e){artifact=null}
})();
</script>
