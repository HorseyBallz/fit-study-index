<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>FIT Study Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a student's "index" — summary band with the 180-credit bar, then one ledger section per semester */
:root{
  --paper:#f4f6f8; --card:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#d8dee6;
  --accent:#d0102b; --accent-soft:#fbe5e8; --blue:#1f4f8f; --blue-soft:#e3ecf7;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b4232c; --bad-soft:#fbe3e4; --save:#ef7d1a;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f151d; --card:#17202b; --ink:#e6ebf1; --muted:#97a3b2; --line:#2a3644;
  --accent:#ff4d64; --accent-soft:#3a1820; --blue:#7fb0ef; --blue-soft:#1b2a3d;
  --ok:#5fd394; --ok-soft:#163023; --warn:#f0b956; --warn-soft:#33270f; --bad:#ff7a82; --bad-soft:#3a1a1d; --save:#ffa04d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151d; --card:#17202b; --ink:#e6ebf1; --muted:#97a3b2; --line:#2a3644;
  --accent:#ff4d64; --accent-soft:#3a1820; --blue:#7fb0ef; --blue-soft:#1b2a3d;
  --ok:#5fd394; --ok-soft:#163023; --warn:#f0b956; --warn-soft:#33270f; --bad:#ff7a82; --bad-soft:#3a1a1d; --save:#ffa04d; color-scheme:dark}
/* the page's own Light / Dark switch wins over the system and viewer theme */
:root[data-mode="light"]{
  --paper:#f4f6f8; --card:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#d8dee6;
  --accent:#d0102b; --accent-soft:#fbe5e8; --blue:#1f4f8f; --blue-soft:#e3ecf7;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b4232c; --bad-soft:#fbe3e4; --save:#ef7d1a; color-scheme:light}
:root[data-mode="dark"]{
  --paper:#0f151d; --card:#17202b; --ink:#e6ebf1; --muted:#97a3b2; --line:#2a3644;
  --accent:#ff4d64; --accent-soft:#3a1820; --blue:#7fb0ef; --blue-soft:#1b2a3d;
  --ok:#5fd394; --ok-soft:#163023; --warn:#f0b956; --warn-soft:#33270f; --bad:#ff7a82; --bad-soft:#3a1a1d; --save:#ffa04d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sumhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sumtitle{font-size:24px;font-weight:700;color:var(--ink)}
.note{margin:0;font-size:13px;color:var(--muted);max-width:70ch}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.stamp{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;line-height:1.05;text-align:center;transform:rotate(-8deg)}
.brand h1{font-size:28px}
.logorow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.logo{height:52px;width:auto;max-width:100%;object-fit:contain;object-position:left;align-self:start}
.madeby{margin:8px 0 0;font-size:13px;color:var(--muted);text-align:center}
.big.met .pct{color:var(--ok)}
.metmsg{margin:0;font-size:14px;font-weight:600;color:var(--ok)}
.bar.pulse{animation:pulse .9s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 35%,transparent)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:51;background:var(--ok);color:var(--card);font-weight:600;padding:10px 18px;border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.bar.pulse{animation:none}}
/* sliding two-option toggles (theme, language) */
.seg.slide{position:relative;display:inline-grid;grid-template-columns:repeat(var(--n,2),1fr);padding:2px}
.seg.slide .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n,2));border-radius:6px;background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2);transform:translateX(calc(var(--pos,0) * 100%))}
.seg.slide button{position:relative;z-index:1;background:none!important;border-radius:6px;text-align:center}
.seg.slide button[aria-pressed="true"]{color:var(--paper)}
@media (prefers-reduced-motion:no-preference){
  .seg.slide .thumb{transition:transform .32s cubic-bezier(.3,.7,.25,1.15),background-color .3s}
  .seg.slide button{transition:color .25s}
  .seg button:active{transform:scale(.96)}
}
/* course card rolls down when opened by a click (class added only then, so re-renders don't replay it) */
@media (prefers-reduced-motion:no-preference){
  details.course.anim .cbody,details.addel.anim .addbody{animation:roll .32s cubic-bezier(.2,.8,.2,1)}
  details.course.anim{animation:lift .32s ease}
  details.course.closing .cbody,details.addel.closing .addbody{animation:roll .3s cubic-bezier(.4,0,.6,1) reverse forwards}
}
@keyframes roll{from{opacity:0;transform:translateY(-8px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes lift{50%{box-shadow:0 6px 18px rgba(0,0,0,.12)}}
/* reset: button + two warning pop-ups over a blurred page */
.footacts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.btn.danger-outline{background:transparent;color:var(--bad);border-color:var(--bad)}
.footacts .btn{padding:7px 14px;transition:background-color .2s,transform .15s}
#exit-btn:hover{background:var(--line)}
.btn.danger-outline:hover{background:var(--bad-soft)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(8,10,14,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mbox{position:relative;max-width:420px;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--bad);border-radius:16px;padding:46px 22px 20px;text-align:center;display:grid;gap:12px;box-shadow:0 0 0 1px color-mix(in srgb,var(--bad) 35%,transparent),0 0 36px color-mix(in srgb,var(--bad) 45%,transparent)}
.mbox h2{font-size:22px}
.mbox p{margin:0;color:var(--muted)}
.mbox .tri{position:absolute;top:-32px;left:50%;width:64px;height:58px;transform:translateX(-50%);filter:drop-shadow(0 0 10px rgba(220,30,50,.6))}
.mbox .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.mbox .acts .btn{padding:8px 16px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.plain{background:transparent;color:var(--ink);border-color:var(--line)}
/* second step: one deliberate dark-red look in both themes */
.mbox.lvl2{background:#4a0a12;color:#fff;border-color:#ff4d64;box-shadow:0 0 0 2px rgba(255,77,100,.5),0 0 60px rgba(255,40,60,.65),0 0 120px rgba(255,40,60,.35)}
.mbox.lvl2 p{color:#ffd5da}
.mbox.lvl2 .btn.plain{color:#fff;border-color:rgba(255,255,255,.45)}
.mbox.lvl2 .btn.danger{background:#ff2d45;border-color:#ff2d45}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:fadein .2s ease}
  .mbox{animation:pop .28s cubic-bezier(.2,.9,.3,1.25)}
  .mbox.lvl2{animation:pop .28s cubic-bezier(.2,.9,.3,1.25),glow 1.6s ease-in-out .3s infinite}
}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
@keyframes glow{50%{box-shadow:0 0 0 2px rgba(255,77,100,.7),0 0 80px rgba(255,40,60,.85),0 0 160px rgba(255,40,60,.45)}}
.shards{position:fixed;inset:0;z-index:61;pointer-events:none;overflow:hidden}
.grouph{font-family:var(--f-body);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:6px 0 0}
.emptyopt{margin:0;font-size:13px;color:var(--muted)}
.unoff{margin:0;font-size:12px;color:var(--warn)}
/* entry notice: shown until the viewer types the accept word */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;align-content:center;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{width:min(320px,100%)}
.gate>*:not(.bigx){position:relative;z-index:1}
/* wrong word: a huge red X flashes behind the box for about 2.5 s */
.bigx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0;color:var(--bad);transition:color .35s ease,opacity .35s ease}
.bigx.ok{color:var(--ok)}
.bigx.out{opacity:0}
.bigx svg{width:min(75vw,75vh);height:auto;opacity:.24;filter:drop-shadow(0 0 30px currentColor);overflow:visible}
.bigx line{stroke:currentColor;stroke-width:14;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .bigx.pop svg{animation:markin .4s cubic-bezier(.2,.9,.3,1.3)}
  .bigx.morph svg{animation:markbump .4s ease}
}
@keyframes markin{from{opacity:0;transform:scale(.6) rotate(-12deg)}}
@keyframes markbump{50%{transform:scale(1.08)}}
.secret{width:100%;font-size:18px;text-align:center;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.secret:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.secret.nope{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){.secret.nope{animation:shake .4s}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip .dot{width:10px;height:10px;flex:none}
.chip.saved .dot{background:var(--ok)} .chip.err .dot{background:var(--bad)}
/* saving: orange spinning ring; saved: the ring closes into a green dot */
.chip.pending .dot{background:transparent;border:2px solid var(--save);border-right-color:transparent}
.chip.pending{color:var(--save)}
@media (prefers-reduced-motion:no-preference){
  .chip.pending .dot{animation:spin .7s linear infinite}
  .chip.saved .dot{animation:morph .55s cubic-bezier(.3,1.4,.5,1)}
  .chip.saved #savetxt{animation:fadein .3s ease}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes morph{0%{background:transparent;border:2px solid var(--save);border-right-color:transparent;transform:rotate(0) scale(1)}
  45%{background:transparent;border:2px solid var(--ok);border-right-color:var(--ok);transform:rotate(300deg) scale(1.15)}
  70%{background:var(--ok);border:0 solid var(--ok);transform:rotate(360deg) scale(1.45)}
  100%{background:var(--ok);border:0 solid var(--ok);transform:rotate(360deg) scale(1)}}

/* summary */
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:18px}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.big .pct{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;color:var(--ink)}
.big .of{color:var(--muted)}
/* progress bar: a slim track, a fill that fades out at its leading edge, a little student riding that edge and the goal waiting at the end */
.track{padding-top:30px}
.bar{--fill:var(--accent);position:relative;height:14px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.bar .done{position:absolute;inset:0 auto 0 0;border-radius:99px 0 0 99px;background:linear-gradient(90deg,var(--fill) 0,var(--fill) max(0px,calc(100% - 48px)),color-mix(in srgb,var(--fill) 0%,transparent) 100%)}
.bar .prog{position:absolute;inset:0 auto 0 0;border-radius:99px 0 0 99px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--fill) 22%,transparent) 0 5px,transparent 5px 10px)}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:color-mix(in srgb,var(--ink) 25%,transparent)}
.bar .rider{position:absolute;bottom:calc(100% + 3px);width:24px;height:24px;margin-left:-12px;color:var(--ink);z-index:2}
.bar .goal{position:absolute;right:-6px;bottom:calc(100% + 3px);width:22px;height:22px;color:var(--muted)}
.bar svg{display:block;width:100%;height:100%;overflow:visible}
.bar .reaper{position:absolute;bottom:calc(100% + 1px);width:32px;height:32px;margin-left:-16px;color:var(--bad);z-index:1}
.bar.caught .rider{color:var(--bad)}
/* a new ✕ drops in; a course that just failed shakes, flashes red and gets a big ✕ stamp */
details.course{position:relative}
.failstamp{position:absolute;inset:0;display:grid;place-items:center;font-size:84px;font-weight:700;line-height:1;color:var(--bad);pointer-events:none;opacity:0;text-shadow:0 0 24px color-mix(in srgb,var(--bad) 60%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .sb.newx{animation:xin .55s cubic-bezier(.2,.9,.3,1.3)}
  .sb.newok{animation:okin .55s cubic-bezier(.2,.9,.3,1.3)}
  details.course.justpassed{animation:passpop .6s cubic-bezier(.2,.9,.3,1.3),passflash 1.2s ease}
  details.course.justfailed{animation:failshake .5s ease,failflash 1.2s ease}
  .failstamp{animation:stamp 1.2s cubic-bezier(.2,.9,.3,1) forwards}
}
@keyframes xin{0%{transform:scale(2.4) rotate(-30deg);opacity:0}55%{transform:scale(.85) rotate(6deg);opacity:1;box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 40%,transparent)}100%{transform:none}}
@keyframes okin{0%{transform:scale(2.4) rotate(30deg);opacity:0}55%{transform:scale(.85) rotate(-6deg);opacity:1;box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 40%,transparent)}100%{transform:none}}
@keyframes passpop{40%{transform:scale(1.035)}}
@keyframes passflash{20%{box-shadow:0 0 0 3px var(--ok),0 0 30px color-mix(in srgb,var(--ok) 55%,transparent)}}
.passstamp{color:var(--ok);text-shadow:0 0 24px color-mix(in srgb,var(--ok) 60%,transparent)}
@keyframes failshake{15%,55%{transform:translateX(-7px)}35%,75%{transform:translateX(7px)}}
@keyframes failflash{20%{box-shadow:0 0 0 3px var(--bad),0 0 30px color-mix(in srgb,var(--bad) 55%,transparent)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-20deg)}25%{opacity:.9;transform:scale(1) rotate(-8deg)}70%{opacity:.75}100%{opacity:0;transform:scale(1.05) rotate(-8deg)}}
/* the reaper leads: a red outline and glow around the bar, stronger and faster the further ahead it is */
.bar.danger::after{content:"";position:absolute;inset:-4px;border-radius:99px;pointer-events:none;border:1.5px solid color-mix(in srgb,var(--bad) 75%,transparent);box-shadow:0 0 18px 4px color-mix(in srgb,var(--bad) 55%,transparent),inset 0 0 8px color-mix(in srgb,var(--bad) 35%,transparent);opacity:var(--hi)}
@media (prefers-reduced-motion:no-preference){.bar.danger::after{animation:aura var(--spd) ease-in-out infinite}}
@keyframes aura{0%,100%{opacity:var(--hi)}50%{opacity:var(--lo)}}
.dlcap{margin:8px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dlcap .dl{color:var(--ink)}.dlcap .dl b{font-weight:400;color:var(--bad)}
.dlcap.caught{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .bar .reaper,.bar .rider{transition:left .9s cubic-bezier(.2,.8,.2,1)}
  .bar .reaper svg{transform-origin:50% 100%;animation:sway 1.6s ease-in-out infinite alternate}
}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.bar.met{--fill:var(--ok)}
.bar.met .done{border-radius:99px;background:var(--fill)}
.bar.met .goal{display:none}
.bar.met .rider{color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.bar:not(.met) .rider svg{animation:jog .7s ease-in-out infinite alternate}}
@keyframes jog{to{transform:translateY(-2px)}}
.scale{position:relative;height:16px;font-size:11px;color:var(--muted)}
.scale span{position:absolute;transform:translateX(-50%)}
.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}
.reqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.req{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.req .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.req .v{font-family:var(--f-mono);font-size:18px;font-weight:500}
.req .s{font-size:12px;color:var(--muted)}
.req.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-soft)}
.req.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-soft)}
.req.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--bad-soft)}

/* semester picker bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.picker{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);color:var(--ink);padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.picker .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.picker .grp{display:flex;align-items:center;gap:8px}
.picker .seg button{padding:6px 14px}

/* semester sections */
.sem{display:grid;gap:12px}
.sem-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sem-head h2{font-size:22px}
/* cards sit in independent columns, so an open card only pushes down the cards under it, never leaves a gap beside it */
.courses{display:flex;gap:12px;align-items:flex-start}
.ccol{flex:1 1 0;min-width:0;display:grid;gap:12px}
/* each card takes one tone from its state: planned grey, in progress blue, at risk amber, credit / passed green, failed red */
details.course{--tone:var(--muted);--tone-soft:var(--paper);background:color-mix(in srgb,var(--tone) 5%,var(--card));border:1px solid color-mix(in srgb,var(--tone) 35%,var(--line));border-radius:12px;min-width:0;transition:background-color .3s,border-color .3s}
details.course[data-vs="planned"]{border-style:dashed;background:var(--card)}
details.course[data-vs="enrolled"]{--tone:var(--blue);--tone-soft:var(--blue-soft)}
details.course[data-vs="risk"]{--tone:var(--warn);--tone-soft:var(--warn-soft)}
details.course[data-vs="credit"]{--tone:var(--ok);--tone-soft:var(--ok-soft)}
details.course[data-vs="passed"]{--tone:var(--ok);--tone-soft:var(--ok-soft);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
details.course[data-vs="failed"]{--tone:var(--bad);--tone-soft:var(--bad-soft);background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.course .code{background:var(--tone-soft);color:var(--tone)}
details.course[data-vs="planned"] .code{background:var(--blue-soft);color:var(--blue)}
/* points bar under the course name: fill = points so far, ticks = credit threshold and the 50-point pass mark */

const TYPE={en:{"Cr+Ex":"Course credit + exam","Ex":"Exam","Cr":"Course credit","ClCr":"Graded course credit"},sk:{"Cr+Ex":"Zápočet + skúška","Ex":"Skúška","Cr":"Zápočet","ClCr":"Klasifikovaný zápočet"}};

/* ---------- State ---------- */
const LS="fit-index-state-v1";
let S=null, artifact=null, canPublish=true, dirty=false, timer=null;
const cur=()=>S.current||"1W";
function defaults(){
  return {v:1,lang:"en",current:"1W",courses:{},electives:[]};
}
function cs(code){ // per-course record
  if(!S.courses[code]){
    const def=allCourses().find(x=>x.c===code);
    S.courses[code]={status:def&&def.s===cur()?"enrolled":"planned",pts:{},extra:[],maxOv:{},exam:["","",""],enroll:1,taken:def?def.s:"1W",credit:null};
  }
  return S.courses[code];
}
function allCourses(){
  const list=[...COURSES];
  for(const e of S.electives){const rich=RICH[e.c]||{};
    list.push({c:e.c,en:e.en||e.n,sk:e.sk||e.n,cr:e.cr,t:e.t,k:e.g||"E",s:e.s,id:e.id||null,parts:rich.parts||[],creditUnknown:rich.creditUnknown,
      exam:e.t==="Cr+Ex"||e.t==="Ex"?EX(100):null,custom:!e.id,free:!rich.parts,opt:true})}
  return list;
}
function load(json){
  S=Object.assign(defaults(),json||{});
}
function localSave(){try{localStorage.setItem(LS,JSON.stringify({at:Date.now(),s:S}))}catch(e){}}
function localLoad(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");return r}catch(e){return null}}

/* ---------- Saving: publish data/state.json through the artifact capability, plus a device copy ---------- */
// restart the class each time so "saved" plays its ring-to-dot animation again even when it was already saved
function setChip(kind,txt){const c=document.getElementById("savechip");c.className="chip";void c.offsetWidth;c.className="chip "+kind;document.getElementById("savetxt").textContent=txt}
function changed(){
  localSave();
  if(!artifact||!canPublish){setChip("saved",L()[canPublish?"local":"readonly"]);return}
  dirty=true;setChip("pending",L().unsaved);
  clearTimeout(timer);timer=setTimeout(publishNow,3000);
}
async function publishNow(){
  if(!dirty||!artifact)return;dirty=false;setChip("pending",L().saving);
  try{await artifact.publish({"data/state.json":JSON.stringify(S)});setChip("saved",L().saved)}
  catch(e){
    const code=e&&e.code;
    if(["not_writer","not_granted","capability_disabled","consent_required","not_declared","capability_removed"].includes(code)){canPublish=false;setChip("saved",L().readonly)}
    else if(code==="conflict"){setChip("pending",L().saving)}
    else setChip("err",L().saveErr);
  }
}

/* ---------- Calculations ---------- */
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmt=n=>Math.round(n*10)/10;
const L=()=>T[S.lang];
const nm=o=>o[S.lang]||o.en;
function grade(p){return p>=90?"A":p>=80?"B":p>=70?"C":p>=60?"D":p>=50?"E":"F"}
function partsOf(d){
  const r=cs(d.c);
  const base=(d.parts||[]).map((p,i)=>({key:"p"+i,n:nm(p),max:r.maxOv["p"+i]!=null?r.maxOv["p"+i]:p.max,min:p.min,val:r.pts["p"+i]}));
  const extra=r.extra.map(x=>({key:x.id,n:x.n,max:x.max,val:x.val,custom:true}));
  return [...base,...extra];
}
function calc(d){
  const r=cs(d.c), parts=partsOf(d);
  const semPts=parts.reduce((a,p)=>a+(num(p.val)||0),0);
  const anyPts=parts.some(p=>num(p.val)!=null);
  const threshold=d.credit!=null?d.credit:(r.credit!=null?r.credit:null);
  const partFails=parts.filter(p=>p.min&& (num(p.val)||0)<p.min);
  const hasCreditStep=d.t==="Cr+Ex"||d.t==="Cr";
  let creditOk=hasCreditStep && (threshold==null?partFails.length===0&&!d.creditUnknown:semPts>=threshold&&partFails.length===0);
  // zeroMax: course credit needs every test written and at most N of them with 0 points
  let zeros=0,missing=0;
  if(d.zeroMax!=null){const base=parts.filter(p=>!p.custom);zeros=base.filter(p=>num(p.val)===0).length;missing=base.filter(p=>num(p.val)==null).length;creditOk=zeros<=d.zeroMax&&missing===0}
  const tries=r.exam.map(num);
  const used=tries.filter(x=>x!=null).length;
  const lastExam=[...tries].reverse().find(x=>x!=null);
  const exMin=d.exam&&d.exam.min||0;
  const examOk=lastExam!=null&&lastExam>=exMin;
  const total=semPts+(d.exam&&examOk?lastExam:0);
  // did the course pass on points? (decides when the "add credits" button appears)
  let passedPts=false;
  if(d.exam) passedPts=examOk&&total>=50&&(d.t!=="Cr+Ex"||creditOk||(threshold==null&&!d.zeroMax&&!d.creditUnknown&&!partFails.length));
  else if(d.t==="ClCr") passedPts=anyPts&&semPts>=50;
  else if(d.t==="Cr"&&parts.length) passedPts=creditOk&&threshold!=null;
  // one box per exam term: X = failed attempt, ✓ = passed
  const marks=tries.map(x=>x==null?"":(x>=exMin&&semPts+x>=50?"ok":"x"));
  const fails=marks.filter(m=>m==="x").length;
  return {r,parts,semPts,anyPts,threshold,partFails,creditOk,tries,used,lastExam,exMin,examOk,total,zeros,missing,passedPts,marks,fails};
}
function stats(){
  const list=allCourses();let passed=0,prog=0,comp=0,elec=0;
  const byYear={},bySlot={};
  for(const d of list){
    const r=cs(d.c);
    if(r.status==="passed"){passed+=d.cr;if(d.k==="C")comp+=d.cr;if(d.k==="E")elec+=d.cr;
      byYear[r.taken[0]]=(byYear[r.taken[0]]||0)+d.cr;bySlot[r.taken]=(bySlot[r.taken]||0)+d.cr}
    else if(r.status==="enrolled"||r.status==="credit")prog+=d.cr;
  }
  return {passed,prog,comp,elec,byYear,bySlot,list};
}

/* ---------- Rendering ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function slotName(s){return L().semTitle(s[0],L().sem[s[1]])}
// pictograms for the progress bar: student on the move, student celebrating, finish flag, graduation cap
const SVG_RUN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="14.5" cy="3.8" r="2.4" fill="currentColor" stroke="none"/><path d="M13.5 8 10.5 14M10.5 14l3 3.5-1 4.5M10.5 14l-3 3.5-3.5 1M12.8 9.2l3 2.6 3-1M12.8 9.2 8.6 10l-2.2 3"/></svg>`;
const SVG_YAY=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="3.8" r="2.4" fill="currentColor" stroke="none"/><path d="M12 8v7M12 15l-3 7M12 15l3 7M12 9.5 7.5 5M12 9.5 16.5 5"/></svg>`;
const GOAL_FLAG=`<span class="goal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 22V3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6 3.5h12l-3 4 3 4H6z" fill="currentColor"/></svg></span>`;
const GOAL_CAP=`<span class="goal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4 1.5 9 12 14l10.5-5z" fill="currentColor"/><path d="M6 11.5V16c0 2 12 2 12 0v-4.5M21 9.5V15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>`;
const rider=(met,pos)=>`<span class="rider" aria-hidden="true" style="left:${met?100:pos}%">${met?SVG_YAY:SVG_RUN}</span>`;
// how far a course is on its way to being passed (0..1), from the points entered so far; passed = 1, failed / planned = 0
function courseShare(d){
  const r=cs(d.c);if(r.status==="passed")return 1;if(r.status!=="enrolled"&&r.status!=="credit")return 0;
  const k=calc(d);
  if(d.exam||d.t==="ClCr")return Math.min(.95,(d.exam?k.semPts+(k.examOk?k.lastExam:0):k.semPts)/50);
  if(d.t==="Cr"&&k.parts.length&&k.threshold)return Math.min(.95,k.semPts/k.threshold);
  return 0;
}
// credits you are on track for: passed credits plus each running course weighted by its share
const onTrack=list=>list.reduce((a,d)=>a+d.cr*courseShare(d),0);
// FIT calendar 2026/27 (fit.vut.cz/study/calendar/2026): winter teaching starts 14 Sep 2026, winter exams 4 Jan - 5 Feb 2027,
// summer teaching from 8 Feb 2027, summer exams 10 May - 11 Jun 2027. Later years reuse the same weekdays 364 days later (approximate).
const CAL0={ws:"2026-09-14",wx:"2027-01-04",we:"2027-02-05",ss:"2027-02-08",sx:"2027-05-10",se:"2027-06-11"};
function calOf(y){const o={};for(const k in CAL0)o[k]=Date.parse(CAL0[k]+"T00:00:00")+(y-1)*364*864e5;return o}
// the window the reaper walks: the 1st semester alone, one study year (the minimum is per year), or the whole bachelor's study
function deadlineWindow(view,slot){
  if(view==="all")return {a:calOf(1).ws,x:calOf(3).sx,b:calOf(3).se+864e5};
  const c=calOf(+slot[0]);
  return slot==="1W"?{a:c.ws,x:c.wx,b:c.we+864e5}:{a:c.ws,x:c.sx,b:c.se+864e5};
}
const SVG_REAPER=`<svg viewBox="0 0 24 24"><path d="M7.5 22.5c0-6.5.6-11 3.2-14 1.7-2 4.4-1.6 5 .9.6 2.6-.6 7 .2 13.1z" fill="currentColor"/><path d="M17.3 22.5 20.2 3.6M14.6 13.2l4.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20.4 3.4c-4.6-2.4-9.4-1.2-11.8 2.4 3.6-1.6 7.6-1.5 11.6-.6z" fill="currentColor"/></svg>`;
function reaperBits(view,slot,studentPct,met,track,target){
  const t=L(),w=deadlineWindow(view,slot),now=Date.now(),day=864e5;
  const share=Math.min(1,Math.max(0,(now-w.a)/(w.b-w.a))),tp=share*100;
  // caught = the reaper (time) is clearly ahead of the student (credits you are on track for); 8 points of slack for the first weeks
  const caught=!met&&now>w.a&&now<w.b&&tp-studentPct>8;
  // danger 0..1: how far the reaper leads the student (full strength at 25 points ahead); drives the red aura around the bar
  const danger=!met&&now>w.a&&now<w.b&&tp>studentPct?Math.min(1,(tp-studentPct)/25):0;
  const aura=danger?` danger" style="--hi:${(.35+.6*danger).toFixed(2)};--lo:${(.12+.2*danger).toFixed(2)};--spd:${(2.4-1.2*danger).toFixed(2)}s`:"";
  let cap;
  const tr=t.dlTrack(fmt(Math.min(track,target)),target);

// Status follows the points: Passed when the points pass the course, Failed on a second 0-point test (IDM, ILG)
// or 3 failed exam terms. Only a status set this way is undone when points change back; one picked by hand stays.
function autoStatus(code){
  const d=allCourses().find(x=>x.c===code);if(!d)return;
  const r=cs(code),k=calc(d);

      d.style.overflow="hidden";
      const ha=d.animate([{height:full+"px"},{height:target+"px"}],{duration:300,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
      const done=()=>{if(d.classList.contains("closing")){d.classList.remove("closing");d.open=false;ha.cancel();d.style.overflow=""}};
      ha.onfinish=done;setTimeout(done,450);
    }else if(d.classList.contains("closing"))e.preventDefault();
  }
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="g-en"||b.id==="g-sk"){S.lang=b.id.slice(2);render();renderGate();localSave();return}
  if(b.id==="lang-en"||b.id==="lang-sk"){S.lang=b.id.slice(5);rerender();changed();return}
  if(b.id==="reset-btn"){openReset(1);return}
  if(b.id==="exit-btn"){openReset("exit");return}
  if(b.id==="th-light"||b.id==="th-dark"){try{localStorage.setItem("fit-theme",b.id.slice(3))}catch(e){}applyTheme();return}
  if(b.dataset.view){S.view=b.dataset.view;render();changed();return}
  if(b.dataset.year||b.dataset.half){const c=cur();S.current=(b.dataset.year||c[0])+(b.dataset.half||c[1]);render();changed();return}
  if(b.dataset.retake){const r=cs(b.dataset.retake);r.taken=SLOTS[SLOTS.indexOf(r.taken)+2];r.enroll=2;r.status="planned";r.exam=["","",""];r.pts={};r.extra=[];rerender();changed();return}
  if(b.dataset.add){const c=b.dataset.add,n=document.getElementById("an-"+c).value.trim(),m=num(document.getElementById("am-"+c).value);if(!n)return document.getElementById("an-"+c).focus();
    cs(c).extra.push({id:"x"+Date.now().toString(36),n,max:m==null?"":m,val:""});rerender();changed();return}
  if(b.dataset.del){const r=cs(b.dataset.del);r.extra=r.extra.filter(x=>x.id!==b.dataset.k);rerender();changed();return}
  if(b.dataset.addopt){const s=b.dataset.addopt,v=document.getElementById("opt-pick-"+s).value;if(!v)return document.getElementById("opt-pick-"+s).focus();
    if(addOptional(v,s)){const r=cs(v);r.status=s===cur()?"enrolled":"planned";S.open=S.open||{};S.open[v]=1}rerender();changed();return}
  if(b.dataset.addel){const s=b.dataset.addel,g=id=>document.getElementById(id);
    const c=g("el-c-"+s).value.trim().toUpperCase(),n=g("el-n-"+s).value.trim(),cr=parseInt(g("el-cr-"+s).value,10),t=g("el-t-"+s).value;
    if(!c||allCourses().some(x=>x.c===c))return g("el-c-"+s).focus(); if(!(cr>0))return g("el-cr-"+s).focus();
    S.electives.push({c,en:n||c,sk:n||c,cr,t,s,g:"E"});const r=cs(c);r.taken=s;r.status=s===cur()?"enrolled":"planned";S.open=S.open||{};S.open[c]=1;rerender();changed();return}
  if(b.dataset.rmel){const c=b.dataset.rmel;S.electives=S.electives.filter(x=>x.c!==c);delete S.courses[c];rerender();changed();return}
});

/* ---------- Boot ---------- */
(async function boot(){
  let server=null;
  try{const r=await fetch("data/state.json",{cache:"no-store"});if(r.ok)server=await r.json()}catch(e){}
  const local=localLoad();
  const serverHasData=server&&server.courses&&Object.keys(server.courses).length;
  load(serverHasData?server:(local&&local.s)||server||null);
  // optional courses now live in S.electives: move ISM, the old English / technical picks and own electives there
  if(!S.optV2){
    if(!S.electives.some(e=>e.c==="ISM")){const had=S.courses.ISM;addOptional("ISM",had?had.taken:"1W");if(!had)cs("ISM").status="enrolled"}
    for(const k of ["pva","pvt"])if(S[k]){const r=S.courses[S[k]];addOptional(S[k],r?r.taken:cur())}
    S.pva=S.pvt="";
    S.electives.forEach(e=>{if(!e.en){e.en=e.sk=e.n;e.g=e.g||"E"}});
    S.optV2=1;
  }
  // IDM changed from one 20-point row to 5 tests: drop the old total, move self-added "Test N" rows into the new slots
  if(!S.idm5&&S.courses.IDM){const r=S.courses.IDM;
    if(num(r.pts.p0)>4)delete r.pts.p0;
    r.extra=r.extra.filter(x=>{const m=/^(test|písomka)\s*([1-5])$/i.exec(x.n.trim());if(!m)return true;r.pts["p"+(m[2]-1)]=x.val;delete r.pts[x.id];return false});
  }
  S.idm5=1;
  showGate();
  allCourses().forEach(d=>autoStatus(d.c));
  render();
  setChip("saved",L().local);
  try{
    if(window.claude&&window.claude.use){
      artifact=await window.claude.use("artifact");
      if(artifact){setChip("saved",L().saved)}
    }
  }catch(e){artifact=null}
})();
</script>
